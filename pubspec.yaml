name: habit_tracker
description: "A frictionless, aesthetically refined, reliable, offline-first habit tracking application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Core State Management & Navigation
  flutter_riverpod: ^2.5.1
  flutter_hooks: ^0.20.5
  go_router: ^13.2.0

  # Database & Persistence
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20

  # Models & Serialization
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Code Generation
  build_runner: ^2.4.8
  freezed: ^2.4.7
  drift_dev: ^2.16.0
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
