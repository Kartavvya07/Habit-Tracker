name: Development Build & Update Publisher

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'updates/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Clean environment
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Run static analysis
        run: flutter analyze

      - name: Run unit & widget tests
        run: flutter test

      - name: Execute publish_dev_build tool
        run: dart tool/publish_dev_build.dart

      - name: Extract build version info
        id: version_info
        run: |
          BUILD_NUM=$(node -e "console.log(require('./updates/latest-dev.json').latestBuild)")
          VERSION_STR=$(node -e "console.log(require('./updates/latest-dev.json').version)")
          echo "BUILD_NUM=$BUILD_NUM" >> $GITHUB_ENV
          echo "VERSION_STR=$VERSION_STR" >> $GITHUB_ENV

      - name: Create GitHub Release for Development Build
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "dev-build-${{ env.BUILD_NUM }}"
          name: "Development Build ${{ env.VERSION_STR }}"
          body: "Automated internal development build for in-app update channel."
          prerelease: true
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push manifest & version bump
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml updates/latest-dev.json updates/development.json
          git commit -m "chore(release): publish development build ${{ env.VERSION_STR }} [skip ci]" || echo "No changes to commit"
          git push
